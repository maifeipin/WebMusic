name: Build and Deploy WebMusic

on:
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: webmusic-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  APP_NAME: webmusic

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.APP_NAME }}-frontend
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.APP_NAME }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # Build & Push Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
             ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.APP_NAME }}-frontend:${{ github.ref_name }}
             ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.APP_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Backend
      # Build & Push Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
             ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.APP_NAME }}-backend:${{ github.ref_name }}
             ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.APP_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push AI Service
      - name: Build and push AI Lyrics
        uses: docker/build-push-action@v4
        with:
          context: ./AI/Lyrics
          file: ./AI/Lyrics/Dockerfile
          push: true
          tags: |
             ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.APP_NAME }}-ai-lyrics:${{ github.ref_name }}
             ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.APP_NAME }}-ai-lyrics:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to MEDIA
    needs: build_and_push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Connect GitHub Runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.115.42.126

      - name: Sync Compose configuration to MEDIA
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MEDIA_HOST }}
          username: ${{ secrets.MEDIA_USER }}
          key: ${{ secrets.MEDIA_SSH_KEY }}
          port: ${{ secrets.MEDIA_PORT || 22 }}
          source: docker-compose.yml
          target: /root/WebMusic

      - name: Deploy published images over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MEDIA_HOST }}
          username: ${{ secrets.MEDIA_USER }}
          key: ${{ secrets.MEDIA_SSH_KEY }}
          port: ${{ secrets.MEDIA_PORT || 22 }}
          script: |
            set -e
            cd /root/WebMusic
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose pull backend frontend
            docker compose up -d --no-build backend frontend
            docker image prune -f
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/)" = "200"
            test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:5080/api/media?page=1&pageSize=1')" = "401"
