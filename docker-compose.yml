

services:
  backend:
    build: 
      context: ./backend
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-maifeipin}/webmusic-backend:latest
    container_name: webmusic-backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Default: Postgres (Controlled by env vars)
      - DatabaseProvider=${DATABASE_PROVIDER:-Postgres}
      # Connection String constructed from env vars
      - ConnectionStrings__Postgres=Host=${POSTGRES_HOST:-postgres};Database=${POSTGRES_DB:-webmusic};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Security
      - Jwt__Key=${JWT_KEY:?JWT_KEY must be set}
      - Jwt__Issuer=WebMusic
      - Jwt__Audience=WebMusicUser
      # AI API Keys (Supports up to 2 keys from env)
      - Gemini__ApiKeys__0=${GEMINI_API_KEY_1}
      - Gemini__ApiKeys__1=${GEMINI_API_KEY_2}
      - Gemini__ApiKeys__2=${GEMINI_API_KEY_3}
      # Internal or External AI Service URL
      - AiLyricsUrl=${AI_LYRICS_URL:-http://webmusic-ai-lyrics:5001}
      # Audit Logging
      - EnableApiRequestLogging=${ENABLE_API_LOGGING:-true}
      - BootstrapAdmin__Username=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - AutomationBot__Username=${ENRICHMENT_BOT_USERNAME:-enrichment-bot}
      - AutomationBot__Password=${ENRICHMENT_BOT_PASSWORD:-}
      - ENRICHMENT_WORKER_SECRET=${ENRICHMENT_WORKER_SECRET:-}
      - ENRICHMENT_WORKER_NODES=${ENRICHMENT_WORKER_NODES:-}
    ports:
      - "5080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres

  frontend:
    build: 
      context: ./frontend
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-maifeipin}/webmusic-frontend:latest
    container_name: webmusic-frontend
    restart: always
    ports:
      - "8090:80"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: webmusic-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-webmusic}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # AI Lyrics Service (Python Sidecar)
  ai-lyrics:
    build: 
      context: ./AI/Lyrics
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-maifeipin}/webmusic-ai-lyrics:latest
    container_name: webmusic-ai-lyrics
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
    profiles: 
      - ai  # Only start if explicitly requested via --profile ai

  # Plugin: Netease Cloud Music API
  netease-api:
    image: binaryify/netease_cloud_music_api:latest
    container_name: webmusic-plugin-netease
    restart: unless-stopped
    ports:
      - "3500:3000"
    environment:
      - PORT=3000
    profiles:
      - plugins
