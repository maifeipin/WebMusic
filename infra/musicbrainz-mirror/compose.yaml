# ==============================================================================
# WebMusic Local MusicBrainz Mirror Compose Configuration
# Extends / Overrides official metabrainz/musicbrainz-docker
# Hard Requirements:
#   1. Web Service (port 5000) MUST listen ONLY on Private LAN / Tailscale IP
#   2. PostgreSQL (5432) & Solr (8983) & Redis/Valkey (6379) are NEVER exposed to host
#   3. Full Web Service and Search Indexer (SIR) enabled (NO alt-db-only-mirror)
#   4. Persistent volumes bound to host data directories
# ==============================================================================

services:
  musicbrainz:
    ports:
      # Explicit binding: defaults to 127.0.0.1 if MUSICBRAINZ_DOCKER_HOST_IPADDRCOL is unset
      - "${MUSICBRAINZ_DOCKER_HOST_IPADDRCOL:-127.0.0.1:}${MUSICBRAINZ_WEB_SERVER_PORT:-5000}:5000"
    volumes:
      - "${DUMP_DIR:-/opt/musicbrainz-data/dumps}:/media/dbdump"
      - "${BACKUP_DIR:-/opt/musicbrainz-data/backups}:/backups"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:5000/ws/2/recording?query=recording:test&fmt=json' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  db:
    volumes:
      - "${PGDATA_DIR:-/opt/musicbrainz-data/pgdata}:/var/lib/postgresql/data"
      - "${DUMP_DIR:-/opt/musicbrainz-data/dumps}:/media/dbdump"
      - "${BACKUP_DIR:-/opt/musicbrainz-data/backups}:/backups"
    command: postgres -c "shared_buffers=${POSTGRES_SHARED_BUFFERS:-2048MB}" -c "work_mem=64MB" -c "maintenance_work_mem=512MB"
    shm_size: "${POSTGRES_SHM_SIZE:-2GB}"
    # Ensure database is strictly internal
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  search:
    volumes:
      - "${SOLRDATA_DIR:-/opt/musicbrainz-data/solrdata}:/var/solr"
      - "${DUMP_DIR:-/opt/musicbrainz-data/dumps}:/media/dbdump:ro"
    environment:
      - "SOLR_HEAP=${SOLR_HEAP:-2g}"
    # Ensure Solr search is strictly internal
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  indexer:
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  valkey:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
